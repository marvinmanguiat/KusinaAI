spring.datasource.url=jdbc:h2:mem:kusinaai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.sql.init.mode=never
app.gemini.api-key=
app.gemini.model=gemini-2.0-flash
app.gemini.fallback-models=gemini-1.5-flash,gemini-1.5-pro
app.security.jwt.secret=test-secret
app.security.jwt.expiration-ms=3600000
app.security.oauth2.frontend-callback-url=http://localhost:5173/oauth2/callback
app.security.cors.allowed-origin=http://localhost:5173
