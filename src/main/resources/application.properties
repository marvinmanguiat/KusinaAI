spring.application.name=KusinaAI
server.forward-headers-strategy=framework


# =========================================================
# Gemini
# =========================================================

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash
app.gemini.fallback-models=gemini-1.5-flash,gemini-1.5-pro
app.gemini.cooldown-minutes=60
app.gemini.cache-minutes=30
app.gemini.model-discovery-cache-minutes=180
app.menu.daily-search-limit=5


# =========================================================
# JWT
# =========================================================

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.oauth2.frontend-callback-url=${OAUTH2_FRONTEND_CALLBACK_URL}
app.security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}


# =========================================================
# OAuth2 - Google
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}


# =========================================================
# OAuth2 - Facebook
# =========================================================

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# Hibernate
# =========================================================

# IMPORTANT:
# Flyway manages database schema changes.
# Hibernate only validates the schema.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# Flyway
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# Mail
# =========================================================

spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true